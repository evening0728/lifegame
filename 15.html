<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 Puzzle</title>
  <style>
    .puzzle-container {
      display: flex;
      flex-wrap: wrap;
      width: 320px;
      border: 4px double #000;
      background-color: bisque;
      
    }
    .puzzle-piece {
        background-color: rgb(171, 233, 212);
      margin:5px;
      width: 70px;
      height: 70px;
      border: 1px solid #000;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      cursor: pointer;
    }

    button{
      width: 80px;
      height: 40px;
      font-size: 16px;
      margin : 5px;
    }
  </style>
</head>
<body>
<button onclick="shuffle(numbers)">shuffle</button>
<button onclick="undo()">undo</button>
<button onclick="redo()">redo</button>
<button>solve</button>
<div style="margin-left: 170px;">이동 횟수 <div id="movecount" style=" width:120px; height:40px; border:1px solid #000; display:inline-flex; align-items:center; justify-content:flex-end; padding-right: 10px;">0</div></div>
  <div class="puzzle-container" id="puzzleContainer"><div class="puzzle-piece">2</div><div class="puzzle-piece">4</div><div class="puzzle-piece">1</div><div class="puzzle-piece">11</div><div class="puzzle-piece">12</div><div class="puzzle-piece">3</div><div class="puzzle-piece">9</div><div class="puzzle-piece">15</div><div class="puzzle-piece">13</div><div class="puzzle-piece">5</div><div class="puzzle-piece">8</div><div class="puzzle-piece">6</div><div class="puzzle-piece">14</div><div class="puzzle-piece">10</div><div class="puzzle-piece">7</div><div class="puzzle-piece"></div></div>
  
  
  <script>
    const puzzleContainer = document.getElementById('puzzleContainer');
    const size = 4; // 4x4 퍼즐
    const numbers = Array.from({length: size * size}, (_, i) => i); // 숫자 배열 생성

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      refreshPuzzle();
    }

    function createPuzzle() {
      shuffle(numbers);
      numbers.forEach((number, index) => {
        const piece = document.createElement('div');
        piece.classList.add('puzzle-piece');
        piece.textContent = number || ''; // 빈 칸은 숫자 대신 공백으로 표시
        piece.addEventListener('click', () => movePiece(index));
        puzzleContainer.appendChild(piece);
      });
    }

    function movePiece(index) {
      const emptyIndex = numbers.indexOf(0);
      if (index === emptyIndex) return; // 클릭한 곳이 빈 칸인 경우
      const rowDiff = Math.abs(Math.floor(emptyIndex / size) - Math.floor(index / size));
      const colDiff = Math.abs((emptyIndex % size) - (index % size));
      if (rowDiff + colDiff !== 1) return; // 이웃한 칸이 아닌 경우

      [numbers[emptyIndex], numbers[index]] = [numbers[index], numbers[emptyIndex]];
      refreshPuzzle();

      history.push([...numbers]);
      future = [];

      movecount++;
      document.getElementById('movecount').textContent = movecount;

    }

    function refreshPuzzle() {
      puzzleContainer.innerHTML = ''; // 기존 퍼즐 비우기
      numbers.forEach((number, index) => {
        const piece = document.createElement('div');
        piece.classList.add('puzzle-piece');
        piece.textContent = number || '';
        piece.addEventListener('click', () => movePiece(index));
        puzzleContainer.appendChild(piece);
      });
      if (isSolved()) alert('Congratulations! You solved the puzzle!');
    }

    function isSolved() {
      return numbers.every((number, index) => number === 0 || number === index + 1);
    }

     shuffle(numbers);

    let history = [];
    let future = [];
    function undo() {
  if (history.length === 0) return;
  future.push([...numbers]);
  const prev = history.pop();
  numbers.splice(0, numbers.length, ...prev); // numbers 배열 내용 교체
  refreshPuzzle();
}
function redo() {
  if (future.length === 0) return;
  history.push([...numbers]);
  const next = future.pop();
  numbers.splice(0, numbers.length, ...next);
  refreshPuzzle();
}

let movecount = 0; 
function movepiece(index) {
  const emptyindex = numbers.indexof(0);
  if (index === emptyindex) return;
  const rowDiff = Math.abs(Math.floor(emptyindex / size) - Math.floor(index / size));
  const colDiff = Math.abs((emptyindex % size) - (index % size));
  if (rowDiff + colDiff !== 1) return;

  history.push([...numbers]);
  future = [];

  [numbers[emptyindex], numbers[index]] = [numbers[index], numbers[emptyindex]];
  
  movecount++;
  document.getElementById('movecount').textContent = '이동 횟수: ' + movecount;
  
  refreshPuzzle();
}
  </script>


</body></html>
